# CodeQL against the Rust source. `cargo audit` in ci-crate.yml covers known
# advisories in dependencies; this covers the code in this repository.
name: CodeQL

on:
  workflow_dispatch:
  # A prose commit cannot change what a code scanner finds. The weekly run
  # below reaches the whole repository whether or not anything was pushed, so
  # skipping a scan of unchanged code costs no coverage.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  schedule:
    # Weekly, so a query-pack update finds this repo without a push.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.31.2
        with:
          languages: rust
          config-file: ./.github/codeql-config.yml
      - uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.31.2
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.31.2
