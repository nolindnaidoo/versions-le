# The Rust CLI's CI.
#
# This repo is crate-only: there is no extension beside it yet, so the `parity`
# and `differential` jobs the two-frontend siblings run have nothing to compare
# and are deliberately absent rather than present and vacuous. They arrive with
# the extension.
name: CI (crate)

on:
  # Manually runnable as well as push-triggered. Push events are not
  # guaranteed: during a GitHub Actions incident they are throttled and
  # silently dropped, and a dropped event never replays — leaving a commit with
  # no way to be verified. Dispatch is the escape hatch.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crate/**'
      - '.github/workflows/ci-crate.yml'
  pull_request:
    paths:
      - 'crate/**'
      - '.github/workflows/ci-crate.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: crate

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.88"
      - name: Verify the declared rust-version actually builds
        run: cargo check --locked

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `#[expect]` is `#[allow]` that complains when it stops being
      # needed. It is still an inline suppression, and a gate that greps
      # for one spelling and not the other is a gate that gets routed
      # around by accident — ips-le carried an `#[expect(dead_code)]`
      # under a green policy job. `tests/` is included: the rule is
      # crate-wide, and a test is not an exemption.
      - name: Forbid inline lint suppressions
        working-directory: .
        run: |
          if grep -rnE '#!?\[[^]]*\b(allow|expect)\(' \
              crate/src crate/tests --include='*.rs'; then
            echo 'Inline #[allow]/#[expect] found — fix the lint, or add a commented'
            echo 'relaxation to [lints.clippy] or [lints.rust] in crate/Cargo.toml.'
            exit 1
          fi
      # The two frontends share one MCP tool and nothing else. A doc that
      # says the crate must reproduce the extension's output re-imposes
      # the constraint the surfaces were deliberately freed from — and it
      # spreads, because the next SPEC.md gets written from a sibling.
      - name: Forbid a doc holding the two surfaces equal
        working-directory: .
        run: |
          hits=$(grep -rniE \
            'difference is a regression|reproduces its output exactly|is the reference implementation for' \
            --include='*.md' . 2>/dev/null | grep -vE '/target/|CHANGELOG\.md' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo
            echo 'Only the shared MCP tool is held equal. The surfaces are IDE-first'
            echo 'and terminal-first and are meant to differ — say which one you mean.'
            exit 1
          fi

  # AGENTS.md sets a 90% line coverage floor per module for detect/.
  # Enforced per module, not on the total: a total hides one module sliding
  # while the others carry it. Scoped to detect/ because everything else
  # is I/O verified by the contract job.
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-llvm-cov
      - name: Measure coverage
        run: |
          cargo llvm-cov --no-report
          cargo llvm-cov report --json --output-path coverage.json
          cargo llvm-cov report --html
      - name: Publish the browsable report
        # Uploaded even when the floor check fails — a failing run is exactly
        # when someone wants to see which lines are uncovered.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: crate/target/llvm-cov/html/
          if-no-files-found: error
      - name: Enforce the per-module floor on detect/
        run: |
          python3 - <<'PY'
          import json, sys
          FLOOR = 90.0
          files = json.load(open("coverage.json"))["data"][0]["files"]
          under = []
          measured = 0
          for f in files:
              if "/detect/" not in f["filename"]:
                  continue
              name = f["filename"].split("/")[-1]
              pct = f["summary"]["lines"]["percent"]
              measured += 1
              print(f"{name:20} {pct:6.2f}%")
              if pct < FLOOR:
                  under.append((name, pct))
          # Zero matches is not zero failures. Rename the directory and the
          # filter above stops matching, the loop never runs, and the job
          # reports success having checked nothing at all.
          if measured == 0:
              print("No modules matched the coverage filter — the job checked nothing.")
              sys.exit(1)
          if under:
              print(f"\nAGENTS.md sets a {FLOOR}% line coverage floor per module in detect/:")
              for name, pct in under:
                  print(f"  {name}: {pct:.2f}%")
              sys.exit(1)
          PY

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-audit
      - run: cargo audit

  # Trees larger than an editor opens: a 400-crate monorepo, a 20,000
  # dependency package.json, and 500 crates inheriting one workspace
  # dependency. Gated behind VERSIONS_LE_SCENARIOS so a bare `cargo test`
  # does not own the run, which is exactly why it needs a job — the suite
  # nothing runs is the suite that rots. Found by adding this job: the
  # refusal scenario still expected 500 refusal rows, from before refusals
  # for one name merged into one row carrying every site.
  scenarios:
    runs-on: ubuntu-24.04
    env:
      VERSIONS_LE_SCENARIOS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Scenarios at scale
        run: cargo test --test scenarios -- --test-threads=1 --nocapture

  # ---------------------------------------------------------------------
  # The five below exist because something real got through a green suite
  # somewhere in this family. Each one names the bug it exists to catch.
  #
  # None of them touches the network — this crate never does — and the
  # three that need no filesystem drive the MCP server's `compare_versions`
  # tool, which takes manifest contents directly.
  # ---------------------------------------------------------------------

  # Inputs a real machine holds and a fixture directory cannot: a
  # byte-order mark, a manifest that is not UTF-8, a symlink loop, a FIFO
  # named Cargo.toml, a mode-000 file, a path over 260 characters, an
  # empty file, and a 50 MB manifest. The tree is built at runtime because
  # Windows cannot check half of it into git, and every case the platform
  # cannot express is skipped by name.
  #
  # The property under all of them is this crate's own: a manifest that
  # misbehaves is named in `diagnostics`, never silently absent. A file
  # that vanished from the report reads to whoever ran it as a file that
  # was clean — which is the one way a validator can lie.
  hazards:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Hazardous inputs against the built binary
        run: cargo test --test hazards -- --nocapture

  # Behaviour that differs by operating system. envsync-le shipped a
  # release whose report used `\` on Windows and `/` everywhere else, red
  # on Windows CI for the whole release before anyone looked.
  #
  # This crate is directly exposed: every manifest it reads is named in
  # the report four times over — `manifests[].path`, a finding's sites, a
  # refusal's sites, and `diagnostics[].file` — and those names are what a
  # reader greps for and diffs against a baseline. A report whose
  # separators follow the machine cannot be diffed between two machines.
  # The rest of the job is what the platform does to the walk: case
  # folding, reserved device names, and CRLF manifests through the two
  # readers that scan lines by hand.
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Separators, case folding, reserved names and line endings
        run: cargo test --test platform -- --nocapture
      # Windows ignores TZ entirely, so a suite that quietly depended on
      # it would be red there and nowhere else. Both runs are compared
      # line for line rather than merely required to pass.
      - name: The suite answers the same with TZ set and unset
        shell: bash
        run: |
          set -euo pipefail
          # Names and outcomes, not the summary lines: those carry a
          # duration, and two runs of the same suite never agree on one.
          names() { grep -E '^test ' | grep -v '^test result:' | sort; }
          TZ=UTC cargo test --locked -- --test-threads=1 2>&1 \
            | names > "$RUNNER_TEMP/tz-utc.txt"
          unset TZ
          cargo test --locked -- --test-threads=1 2>&1 \
            | names > "$RUNNER_TEMP/tz-unset.txt"
          test -s "$RUNNER_TEMP/tz-utc.txt"
          diff -u "$RUNNER_TEMP/tz-utc.txt" "$RUNNER_TEMP/tz-unset.txt"

  # The corpus pins the constraint strings somebody thought of; this
  # generates the ones nobody did — prerelease chains hundreds of segments
  # long, hundreds of `||` alternatives intersected against hundreds more,
  # unicode digits, and every grammar the tool has declared it does not
  # model.
  #
  # Two properties. The report must stay well-formed: one JSON object,
  # `schema: 1`, a summary that counts the lists beside it, and no site
  # naming a file nobody supplied. And the one this crate cannot afford to
  # lose — **a grammar it does not model never becomes a conflict.** Half
  # the generated pairs put a real constraint beside a `workspace:`
  # specifier, a PEP 440 `~=`, a git URL or a CI channel name; each must
  # come back as a named refusal that took part in no comparison. A
  # regression that started guessing turns one of those into a
  # `disjoint-constraint` against somebody's real manifest.
  fuzz:
    runs-on: ubuntu-24.04
    env:
      VERSIONS_LE_FUZZ_SECONDS: '60'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Sixty seconds against the grammars and the readers
        run: cargo test --test fuzz -- --test-threads=1 --nocapture

  # A wall-clock ceiling on a corpus generated from a fixed seed, plus two
  # linearity checks: four times the manifests, and four times the
  # dependencies in one manifest. The second is the one this crate is
  # exposed to — disjointness is interval arithmetic over pairs, so a
  # comparison that reached for every entry rather than every entry of one
  # name would be quadratic in how wide a manifest is. Every other test in
  # the suite uses manifests narrow enough to hide that.
  budget:
    runs-on: ubuntu-24.04
    env:
      VERSIONS_LE_BUDGET: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: 500 manifests inside the budget, and linear in both directions
        run: cargo test --test budget -- --test-threads=1 --nocapture

  # Does the crate open what it claims?
  #
  # The extractor crates in this family answer that with one corpus
  # document per extension in their alias table. This crate's table is its
  # five ecosystems, five manifest kinds, six checks and three refusal
  # reasons — every one of them a claim in SPEC.md and the README — so
  # that is the matrix. Both directions are checked: every claim reachable
  # from a real fixture, and nothing in the code the corpus cannot
  # produce. A check with no corpus case behind it is a README line no
  # test stands behind.
  #
  # The marker check is not decoration: `cargo test <filter>` exits 0 when
  # the filter matches nothing, so a renamed test would pass this job
  # silently.
  coverage-matrix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Every ecosystem, manifest kind, finding and refusal
        shell: bash
        run: |
          set -euo pipefail
          cargo test --bins coverage_matrix -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/coverage-matrix.txt"
          grep -q 'coverage-matrix: 5 ecosystems and 5 manifest kinds reachable' \
            "$RUNNER_TEMP/coverage-matrix.txt"
          grep -q 'coverage-matrix: 6 finding codes and 4 refusal reasons reachable' \
            "$RUNNER_TEMP/coverage-matrix.txt"

  # The commit convention was claimed by .githooks/commit-msg and by
  # AGENTS.md, and enforced by neither: core.hooksPath is opt-in per
  # clone, so `--no-verify` or a fresh checkout skipped it permanently
  # rather than deferring it. Three separate audits flagged the same
  # false claim. This is the gate that makes it true.
  commits:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every pushed commit is conventional
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._,/ -]+\))?!?: .+'
          fail=0
          while read -r sha subject; do
            case "$subject" in "Merge "*|"Revert "*) continue ;; esac
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "not conventional: $sha $subject"; fail=1
            fi
            if [ "${#subject}" -gt 72 ]; then
              echo "subject is ${#subject} chars, limit 72: $sha $subject"; fail=1
            fi
          done < <(git log --no-merges --format='%h %s' "$base..HEAD")
          exit $fail
