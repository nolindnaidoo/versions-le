name: ci
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
